worker_processes 1;
master_process off;
daemon off;
error_log /nginx/logs/error.log debug;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;
    fastcgi_temp_path /tmp;
    uwsgi_temp_path /tmp;
    scgi_temp_path /tmp;
    server {
        listen 80;
        location / {
            root /nginx/html;
            index index.html;
        }
    }
}
