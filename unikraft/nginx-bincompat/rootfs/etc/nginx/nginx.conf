worker_processes 1;
master_process off;
daemon off;
error_log stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server {
        listen 8080;
        location / {
            default_type text/plain;
            return 200 "Unikraft Bincompat Validat cu succes!\n";
        }
    }
}
